name: Connect iOS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: connect-ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS iOS (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check Expo token is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository Actions secret is missing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock
          fi

      - name: Validate source
        run: npm run check

      - name: Prepare selected Connect icon
        run: npm run prepare:icon

      - name: Install EAS CLI
        run: npm install --global eas-cli@18

      - name: Submit build to EAS
        run: |
          eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive --no-wait
